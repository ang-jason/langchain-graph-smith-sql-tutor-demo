[project]
name = "sql-tutor"
version = "0.1.0"
description = "SQL Tutor — LangChain + LangGraph + LangSmith"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "python-dotenv==1.0.1",

    # LangChain core
    "langchain==0.2.6",
    "langchain-core==0.2.10",
    "langgraph==0.2.4",
    "langsmith==0.1.83",

    # LLM Providers
    "langchain-groq==0.1.6",
    "langchain-anthropic==0.1.19",
    "langchain-openai==0.1.14",
    "langchain-google-genai==1.0.6",
    "langchain-mistralai==0.1.9",
    "langchain-cohere==0.2.2",
    "langchain-together==0.1.3",
    "langchain-fireworks==0.1.4",
    "langchain-ollama==0.1.1",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
